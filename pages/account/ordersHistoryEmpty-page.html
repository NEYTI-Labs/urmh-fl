<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/vite.svg" />
        <link rel="stylesheet" href="./sass/ordersHistory/index.scss" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HMRU</title>
    </head>
    <body>
        {{> _header}}

        <main class="main page-content ordersHistory__main">
            <div class="container account__container">
                <ol class="kroshki">
                    <li>
                        <a href="/public" title="Главная"> Главная </a>
                    </li>
                </ol>
                <section class="ordersHistory">
                    <div class="account-top">
                        <h1 class="page-heading">Личный кабинет</h1>
                        <button type="button" class="account-nav__actions" aria-label="Открыть меню кабинета"
                            aria-expanded="false" aria-controls="account-nav">
                            <img src="/images/account/icons/menu.svg" alt="">
                        </button>
                    </div>
                    <div class="account-wrapper">
                        {{> _account-nav sectionOrders=true pageOrdersHistory=true navCollapse=1160}}
                        <div class="ordersHistory-content">
                            <div class="ordersHistory-table ordersHistory-table--empty">
                                <h4 class="ordersHistory-table__title">Активные заказы</h4>
                                <div class="account-empty">
                                    <img class="account-empty__icon" src="/images/account/icons/empty1.png" alt="">
                                    <p class="account-empty__text">У вас нет заказов</p>
                                    <a class="btn" href="#">Перейти в каталог</a>
                                </div>
                            </div>

                            <div class="ordersHistory-table ordersHistory-table--completed ordersHistory-table--empty">
                                <h4 class="ordersHistory-table__title">Завершенные заказы</h4>

                                <div class="account-empty">
                                    <img class="account-empty__icon" src="/images/account/icons/empty1.png" alt="">
                                    <p class="account-empty__text">У вас нет заказов</p>
                                    <a class="btn" href="#">Перейти в каталог</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        {{> _footer}}

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
        <script type="module" src="/main.js"></script>
        <script type="module" src="./account-script.js"></script>
    </body>
</html>

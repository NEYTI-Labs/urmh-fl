<div class="account-overlay"></div>

                    </svg>
                </button>

                <div class="account-nav__sub">
                    <ul class="account-nav__sub-list">
                        <li>
                            <a class="account-nav__sub-link{{#if sectionOrders}} is-active{{/if}}" href="orders-page.html"

                            <li><a class="account-nav__sub-link" href="#">История заказов</a></li>

                            <li>
                                <a class="account-nav__sub-link{{#if sectionLoyalty}} is-active{{/if}}" href="loyalty-page.html"

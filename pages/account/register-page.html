<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="./sass/index.scss" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMRU</title>
    </head>
    <body>
    {{> _header}}

    <main class="main page-content  account__main">
    <div class="container account__container">
    <ol class="kroshki kroshki__account">
        <li>
        <a href="/public" title="Главная"> Главная </a>
        </li>
    </ol>
    <section class="account">
      <div class="account__wrapper">
        <h1 class="page-heading">Регистрация</h1>
        <div class="account__content">
          <form class="account__form" action="">
              <input type="text" placeholder="Имя" required>
              <input type="text" placeholder="Фамилия" required>
              <input type="tel" placeholder="Телефон" required>
              <input type="email" placeholder="Электронная почта" required>
              <input type="password" placeholder="Пароль" required>
              <input type="password" placeholder="Повторите пароль" required>
              <button class="btn" type="submit">Отправить</button>
          </form>
          <button class="account__btn" type="submit" onclick="history.back(); return false;">Вернуться назад</button>
        </div>
        <div class="account__footer">
          <span>Техническая поддержка</span>
          <div class="account__footer_link">
            <img src="/public/images/icons/account-icon1.png" alt="">
            <a href="mailto:support@hmru.ru">support@hmru.ru</a>
          </div>
        </div>
      </div>
    </section>
    </div>
    </main>

    {{> _footer}}

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script type="module" src="/main.js"></script>
    </body>
    </html>

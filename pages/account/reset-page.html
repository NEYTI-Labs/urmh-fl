<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="./sass/index.scss" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMRU</title>
    </head>
    <body>
    {{> _header}}

    <main class="main page-content  account__main">
    <div class="container account__container">
    <ol class="kroshki kroshki__account">
        <li>
        <a href="/public" title="Главная"> Главная </a>
        </li>
    </ol>
    <section class="account">
      <div class="account__wrapper">
        <h1 class="page-heading">Запрос пароля</h1>
        <div class="account__content">
          <h4>Выслать контрольную строку</h4>
          <form class="account__form account__form--large-gap"  action="">
            <input type="text" placeholder="Логин или электронная почта" required>
            <p>Контрольная строка для смены пароля, а также ваши регистрационные данные, будут высланы вам на электронную почту.</p>
            <button class="btn btn--large-gap" type="submit">Выслать</button>
          </form>
          <button class="account__btn" onclick="history.back(); return false;">Вернуться назад</button>
        </div>
      </div>
    </section>
    </div>
    </main>

    {{> _footer}}

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script type="module" src="/main.js"></script>
    </body>
    </html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="./sass/index.scss" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HMRU</title>
    </head>
    <body>
    {{> _header}}

    <main class="main page-content comparisonEmpty__main">
    <div class="container comparisonEmpty__container">
    <ol class="kroshki">
        <li>
        <a href="/public" title="Главная"> Главная </a>
        </li>
    </ol>
    <section class="comparisonEmpty">
        <div class="comparisonEmpty__head">
            <h1 class="comparison-title">Сравнение товаров</h1>

                <button class="comparison-btn " type="button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M13 11H19V13H13V19H11V13H5V11H11V5H13V11Z" fill="currentcolor" />
                    </svg>

                </button>
            </div>
        </div>
        <div class="comparisonEmpty__content">
            <div class="comparisonEmpty__image">
                <img src="/images/favoritesEmpty.png" alt="">
            </div>
            <div class="comparisonEmpty__text">
                <h4>Здесь пока пусто</h4>
                <p>Добавьте интересующее оборудование, чтобы сравнить его характеристики</p>
            </div>
            <a href="#" class="btn">Перейти в каталог</a>
        </div>
    </section>
    </main>

    {{> _footer}}

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script type="module" src="/main.js"></script>
